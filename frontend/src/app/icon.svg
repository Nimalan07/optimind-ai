<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cyan to Green Gradient matching Logo -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
  </defs>
  
  <!-- Background hexagon base -->
  <polygon points="64,8 116,38 116,98 64,120 12,98 12,38" fill="none" stroke="url(#logo-grad)" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Outer processor pins -->
  <line x1="12" y1="50" x2="2" y2="50" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />
  <line x1="12" y1="64" x2="0" y2="64" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />
  <line x1="12" y1="78" x2="2" y2="78" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />
  
  <line x1="116" y1="50" x2="126" y2="50" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />
  <line x1="116" y1="64" x2="128" y2="64" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />
  <line x1="116" y1="78" x2="126" y2="78" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />

  <!-- Inner CPU square container -->
  <rect x="36" y="36" width="56" height="56" rx="10" fill="#0D1321" stroke="url(#logo-grad)" stroke-width="4" />
  
  <!-- Stylized Brain Nodes & Lines -->
  <!-- Left Hemisphere -->
  <circle cx="50" cy="56" r="3" fill="url(#logo-grad)" />
  <circle cx="46" cy="68" r="3" fill="url(#logo-grad)" />
  <circle cx="56" cy="74" r="3" fill="url(#logo-grad)" />
  <circle cx="58" cy="62" r="3" fill="url(#logo-grad)" />
  
  <!-- Right Hemisphere -->
  <circle cx="78" cy="56" r="3" fill="url(#logo-grad)" />
  <circle cx="82" cy="68" r="3" fill="url(#logo-grad)" />
  <circle cx="72" cy="74" r="3" fill="url(#logo-grad)" />
  <circle cx="70" cy="62" r="3" fill="url(#logo-grad)" />

  <!-- Brain Stem & Connectors -->
  <line x1="50" y1="56" x2="46" y2="68" stroke="url(#logo-grad)" stroke-width="2" />
  <line x1="46" y1="68" x2="56" y2="74" stroke="url(#logo-grad)" stroke-width="2" />
  <line x1="56" y1="74" x2="58" y2="62" stroke="url(#logo-grad)" stroke-width="2" />
  <line x1="58" y1="62" x2="50" y2="56" stroke="url(#logo-grad)" stroke-width="2" />
  
  <line x1="78" y1="56" x2="82" y2="68" stroke="url(#logo-grad)" stroke-width="2" />
  <line x1="82" y1="68" x2="72" y2="74" stroke="url(#logo-grad)" stroke-width="2" />
  <line x1="72" y1="74" x2="70" y2="62" stroke="url(#logo-grad)" stroke-width="2" />
  <line x1="70" y1="62" x2="78" y2="56" stroke="url(#logo-grad)" stroke-width="2" />
  
  <!-- Connecting bridge -->
  <line x1="58" y1="62" x2="70" y2="62" stroke="url(#logo-grad)" stroke-width="2" />
  <line x1="56" y1="74" x2="72" y2="74" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" />
</svg>
